services:
 postgres:
  image: postgres:16
  container_name: aremmata-patrimonio-postgres
  restart: always

  environment:
   POSTGRES_USER: postgres
   POSTGRES_PASSWORD: postgres
   POSTGRES_DB: arremata_patrimonio

  ports:
   - "5432:5432"

  volumes:
   - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

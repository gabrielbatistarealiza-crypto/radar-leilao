# Testes em cada PR e em cada push para o main. Não faz deploy nem usa segredos:
# a base é um PostgreSQL descartável criado só para esta execução.
name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arremata_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Valores só de teste; nunca os da produção.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arremata_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arremata_test
      SECRET_KEY: chave-apenas-para-a-ci-nao-usar-em-producao
      RADAR_DISABLE_BACKGROUND_JOBS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # A mesma versão da imagem de produção (playwright/python noble).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Testes (PostgreSQL)
        run: pytest -q -p no:cacheprovider
      - name: Migrações aplicam numa base vazia
        run: |
          python -c "import psycopg2; c=psycopg2.connect('postgresql://postgres:postgres@localhost:5432/postgres'); c.autocommit=True; c.cursor().execute('CREATE DATABASE migracoes_ci')"
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/migracoes_ci alembic upgrade head
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/migracoes_ci alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

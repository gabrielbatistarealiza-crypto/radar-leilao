# Migrações da base de dados (Alembic). Correr a partir da pasta backend.
# A ligação vem SEMPRE da variável DATABASE_URL (ver migrations/env.py);
# nunca escrever a URL aqui.
#
#   alembic upgrade head      aplica as migrações em falta
#   alembic current           mostra a versão em que a base está
#   alembic revision --autogenerate -m "descricao"   nova migração a partir dos modelos

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
